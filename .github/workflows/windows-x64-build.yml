name: Windows x64 Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit to build"
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  HUSKY: 0

jobs:
  build:
    name: Build Windows x64 installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
          rustup target add x86_64-pc-windows-msvc

      - name: Install pnpm
        shell: pwsh
        run: corepack install --global pnpm@12.0.0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Windows x64 resources
        run: pnpm run prebuild x86_64-pc-windows-msvc

      - name: Build NSIS installer
        run: >-
          pnpm tauri build
          --target x86_64-pc-windows-msvc
          --bundles nsis
          --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: clash-verge-windows-x64
          if-no-files-found: error
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.nsis.zip
